aid: amazingtalker
name: AmazingTalker
description: >-
  AmazingTalker is an online tutoring marketplace, founded in 2016 and
  headquartered in Taipei, that connects students with vetted professional
  tutors for personalized 1-on-1 lessons in more than 60 languages plus
  academic, music, and lifestyle subjects. Learners browse tutor profiles,
  compare pricing and ratings, book trial and formal lessons on a flexible
  pay-as-you-go basis, and meet over Zoom. AmazingTalker publicly exposes a
  ChatGPT-plugin OpenAPI (findTeachers) that returns bookable tutors for a
  subject with price, learning-need, auxiliary-language, and location filters.
